name: LagTrader Bot Execution

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the UI anytime

# Explicitly grant write access to repository contents
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LagTrader Script
        run: python bot.py

      - name: Commit Trade Logs & Portfolio State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update paper trades [skip ci]" && git push origin HEAD:${{ github.ref }})
