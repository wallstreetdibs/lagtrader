name: LagTrader Bot Execution

on:
  schedule:
    # Runs every 5 minutes (* * * * * = min, hour, day, month, day-of-week)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the UI anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LagTrader Script
        run: python bot.py
